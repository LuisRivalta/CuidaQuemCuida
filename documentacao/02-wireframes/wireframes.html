<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CuidaQuemCuida — Wireframes</title>
<style>
  :root { --tinta: #333; --linha: #9a9a9a; --caixa: #e6e6e6; --fundo: #f4f4f4; --forte: #777; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #fff; color: var(--tinta); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.nota { color: #666; margin: 0 0 20px; max-width: 900px; }
  .telas { display: flex; flex-wrap: wrap; gap: 28px; }
  figure { margin: 0; }
  figcaption { font-weight: 700; margin-top: 8px; text-align: center; }
  .cel { width: 240px; height: 480px; border: 3px solid var(--tinta); border-radius: 26px; padding: 10px; background: var(--fundo);
         display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .topo { height: 26px; border-bottom: 1px solid var(--linha); display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
  .bloco { background: var(--caixa); border: 1px solid var(--linha); border-radius: 8px; padding: 6px; font-size: 11px; }
  .alerta { border: 2px solid var(--forte); }
  .tracejado { border: 2px dashed var(--forte); background: #fff; }
  .botao { background: var(--forte); color: #fff; border-radius: 6px; padding: 6px; text-align: center; font-size: 11px; font-weight: 700; }
  .botao.claro { background: #fff; color: var(--tinta); border: 1px solid var(--forte); }
  .campo { height: 24px; border: 1px solid var(--linha); background: #fff; border-radius: 4px; }
  .rot { font-size: 10px; font-weight: 700; margin-top: 2px; }
  .linha { display: flex; gap: 6px; align-items: center; }
  .linha > * { flex: 1; }
  .ponto { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--forte); flex: 0 0 10px; }
  .ponto.cheio { background: var(--forte); }
  .barra { height: 8px; background: var(--forte); border-radius: 4px; }
  .grafico { height: 70px; border: 1px solid var(--linha); background: repeating-linear-gradient(90deg, #fff, #fff 18px, #eee 18px, #eee 19px); position: relative; }
  .grafico::after { content: ""; position: absolute; left: 6px; right: 6px; top: 40%; border-top: 2px solid var(--forte); transform: skewY(-6deg); }
  .espaco { flex: 1; }
  .menu { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--linha); padding-top: 4px; font-size: 9px; text-align: center; }
  .menu b { text-decoration: underline; }
  .xs { font-size: 10px; color: #555; }
  .ceu { background: linear-gradient(#ddd, #fafafa); padding: 12px 6px; text-align: center; border-radius: 12px; }
  .respiro { flex: none; width: 46px; height: 46px; border: 2px solid var(--linha); border-radius: 50%; margin: 6px auto; }
</style>
</head>
